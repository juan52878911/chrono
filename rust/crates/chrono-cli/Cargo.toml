[package]
name = "chrono-cli"
description = "Binario `chrono` (port Rust, R2): init/sync sobre git, forge (gh) y consultas JSON acotadas."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "chrono"
path = "src/main.rs"

# Sin clap ni serde a propósito: el parseo de args y el JSON de salida son
# pequeños y se hacen a mano para no inflar el binario.
[dependencies]
chrono-core = { path = "../chrono-core" }
chrono-store = { path = "../chrono-store" }
chrono-source-git = { path = "../chrono-source-git" }
chrono-metrics = { path = "../chrono-metrics" }
chrono-classify-rules = { path = "../chrono-classify-rules" }
chrono-tracker-github = { path = "../chrono-tracker-github" }
chrono-source-jsonl = { path = "../chrono-source-jsonl" }
chrono-source-csv = { path = "../chrono-source-csv" }
chrono-source-textlog = { path = "../chrono-source-textlog" }
chrono-mcp = { path = "../chrono-mcp" }
