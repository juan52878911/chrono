[package]
name = "chrono-tracker-github"
description = "Adaptador Tracker de GitHub (gh): PRs/issues del forge hacia el índice."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono-core = { path = "../chrono-core" }
chrono-store = { path = "../chrono-store" }
# Para parsear la salida `gh --json` de PRs/issues.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Mismo rusqlite que chrono-store (unificado por Cargo): solo para el `params!`
# del upsert en `issues`; la conexión la abre y migra chrono-store.
rusqlite = "0.32"
