[workspace]
resolver = "2"
members = [
    "crates/chrono-core",
    "crates/chrono-store",
    "crates/chrono-source-git",
    "crates/chrono-metrics",
    "crates/chrono-classify-rules",
    "crates/chrono-tracker-github",
    "crates/chrono-source-jsonl",
    "crates/chrono-mcp",
    "crates/chrono-cli",
]

[workspace.package]
version = "0.2.0-dev"
edition = "2021"
license = "MIT"
repository = "https://github.com/juan52878911/chrono"

# Perfil de release: binario pequeño y rápido (objetivo del port a Rust).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
